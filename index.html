<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wohnportier</title>
<style>
:root{--bg:#F5F6F7;--ink:#14202B;--muted:#55636F;--accent:#11615A}
@media (prefers-color-scheme:dark){:root{--bg:#0E161D;--ink:#E8EEF2;--muted:#A0AFBB;--accent:#5CC4B5}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;padding:24px 16px}
main{max-width:34rem}
h1{margin:0 0 12px;font-size:clamp(2.4rem,9vw,3.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.05}
p{margin:0;color:var(--muted);font-size:1.1rem}
.bar{width:48px;height:4px;background:var(--accent);margin-bottom:24px;border-radius:2px}
</style>
</head>
<body>
<main>
<div class="bar"></div>
<h1>Wohnportier</h1>
<p>Diese Seite ist in Vorbereitung.</p>
</main>
</body>
</html>
